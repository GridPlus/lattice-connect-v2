services:
  mqtt:
    image: eclipse-mosquitto:2.0.15
    container_name: lattice_mqtt
    ports:
      - "${MQTT_HTTP_PORT:-1883}:1883"  # MQTT
      - "9001:9001"  # WebSocket
    volumes:
      - ./mqtt/mqtt-config:/mosquitto/config
      - ./mqtt/mqtt-data:/mosquitto/data
      - ./mqtt/mqtt-log:/mosquitto/log
    networks:
      - lattice-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$", "-E", "-i", "docker-health-check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

