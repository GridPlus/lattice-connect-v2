version: '3.8'

services:
  mqtt:
    image: eclipse-mosquitto:2.0.15
    container_name: lattice_mqtt_test
    ports:
      - "8883:1883"  # MQTT
      - "9001:9001"  # WebSocket
    volumes:
      - ./mqtt-config:/mosquitto/config
      - ./mqtt-data:/mosquitto/data
      - ./mqtt-log:/mosquitto/log
    networks:
      - lattice-test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 5s
      timeout: 3s
      retries: 3

networks:
  lattice-test-network:
    driver: bridge 